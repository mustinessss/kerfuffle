name: kerfuffle-production

networks:
  kerfuffle:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/opt/kerfuffle/tls/server.crt
      - -c
      - ssl_key_file=/opt/kerfuffle/tls/server.key
      - -c
      - hba_file=/opt/kerfuffle/tls/pg_hba.conf
    environment:
      POSTGRES_DB: kerfuffle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deploy/.env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/app_role.sql:/opt/kerfuffle/app_role.sql:ro
      - ./init-app-role.sql:/docker-entrypoint-initdb.d/01-app-role.sql:ro
      - ./postgres-tls/server.crt:/opt/kerfuffle/tls/server.crt:ro
      - ./postgres-tls/server.key:/opt/kerfuffle/tls/server.key:ro
      - ./postgres-tls/pg_hba.conf:/opt/kerfuffle/tls/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kerfuffle"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      kerfuffle:
        ipv4_address: 172.28.0.10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    image: ghcr.io/mustinessss/kerfuffle-backend:${KERFUFFLE_IMAGE_TAG:-latest}
    pull_policy: always
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      ENVIRONMENT: production
      DATABASE_MIGRATION_MODE: "true"
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/kerfuffle?sslmode=verify-full&sslrootcert=/opt/kerfuffle/tls/ca.crt
      ACCESS_CODE_HASH_SECRET: ${ACCESS_CODE_HASH_SECRET:?Set ACCESS_CODE_HASH_SECRET in deploy/.env.production}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in deploy/.env.production}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?Set APP_ALLOWED_ORIGINS in deploy/.env.production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MANUAL_AUTH_LINKS_ENABLED: ${MANUAL_AUTH_LINKS_ENABLED:-false}
    volumes:
      - ./postgres-tls/ca.crt:/opt/kerfuffle/tls/ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - kerfuffle
    restart: "no"

  backend:
    image: ghcr.io/mustinessss/kerfuffle-backend:${KERFUFFLE_IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://kerfuffle_app:${APP_DB_PASSWORD}@db:5432/kerfuffle?sslmode=verify-full&sslrootcert=/opt/kerfuffle/tls/ca.crt
      ACCESS_CODE_HASH_SECRET: ${ACCESS_CODE_HASH_SECRET:?Set ACCESS_CODE_HASH_SECRET in deploy/.env.production}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Set APP_PUBLIC_URL in deploy/.env.production}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?Set APP_ALLOWED_ORIGINS in deploy/.env.production}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MANUAL_AUTH_LINKS_ENABLED: ${MANUAL_AUTH_LINKS_ENABLED:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      SESSION_ABSOLUTE_HOURS: ${SESSION_ABSOLUTE_HOURS:-12}
    volumes:
      - ./postgres-tls/ca.crt:/opt/kerfuffle/tls/ca.crt:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - kerfuffle
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    image: ghcr.io/mustinessss/kerfuffle-frontend:${KERFUFFLE_IMAGE_TAG:-latest}
    pull_policy: always
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kerfuffle
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      kerfuffle:
        ipv4_address: 172.28.0.2
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
