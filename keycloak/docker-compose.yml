services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in keycloak/.env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in keycloak/.env}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./kerfuffle-realm.json:/opt/keycloak/data/import/kerfuffle-realm.json:ro
      - keycloak-data:/opt/keycloak/data/h2

volumes:
  keycloak-data:
